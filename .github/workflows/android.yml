name: Android APK

# Bij elke push naar main bouwt GitHub een installeerbare APK
# en zet die bij Releases. Handmatig starten kan via "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pakketten installeren
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Versies afstemmen op de Expo SDK
        run: npx expo install --fix -- --legacy-peer-deps

      - name: Rekentests
        run: npm test

      - name: Typecheck (waarschuwt alleen)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Android-project genereren
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bouwen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: APK hernoemen
        run: cp android/app/build/outputs/apk/release/app-release.apk freaking-food-tracker-${{ github.run_number }}.apk

      - name: Release maken
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Freaking Food Tracker ${{ github.run_number }}
          body: |
            Nieuwe versie van Freaking Food Tracker.
            Open dit op je Android-telefoon, tik op het .apk-bestand hieronder en installeer het.
            Commit: ${{ github.sha }}
          files: freaking-food-tracker-${{ github.run_number }}.apk
          make_latest: true
