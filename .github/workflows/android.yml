name: Android APK

# Bij elke push naar main bouwt GitHub een installeerbare APK
# en zet die bij Releases. Handmatig starten kan via "Run workflow".
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Snelle controles in een eigen job: de uitkomst is binnen een paar minuten
  # te lezen (als meldingen), los van het bouwen van de APK.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pakketten installeren
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Versies afstemmen op de Expo SDK
        run: npx expo install --fix -- --legacy-peer-deps

      - name: Controle eigen native module (autolinking)
        continue-on-error: true
        run: |
          npx expo-modules-autolinking search > modules.json 2>&1 || true
          if grep -q barcode-photo modules.json; then
            echo "::notice title=autolink::barcode-photo wordt gevonden door autolinking"
          else
            echo "::warning title=autolink::barcode-photo NIET gevonden door autolinking"
            head -c 600 modules.json | tr '\n' ' ' | sed 's/^/::warning title=autolink::/'; echo
          fi

      - name: Fotoscanner-test (waarschuwt alleen)
        continue-on-error: true
        run: |
          set +e
          npm run test:scan > scan.log 2>&1
          code=$?
          grep -E "gelezen als|^not ok|^# (pass|fail)|Error|error" scan.log | head -40 | while IFS= read -r line; do echo "::warning title=scan::$line"; done
          exit $code

      - name: Typecheck (waarschuwt alleen)
        continue-on-error: true
        run: |
          set +e
          npx tsc --noEmit > tsc.log 2>&1
          code=$?
          grep "error TS" tsc.log | head -30 | while IFS= read -r line; do echo "::warning title=tsc::$line"; done
          exit $code

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pakketten installeren
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Versies afstemmen op de Expo SDK
        run: npx expo install --fix -- --legacy-peer-deps

      - name: Rekentests
        run: npm test

      - name: Android-project genereren
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bouwen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: APK hernoemen
        run: cp android/app/build/outputs/apk/release/app-release.apk freaking-food-tracker-${{ github.run_number }}.apk

      - name: Controle native scanner
        run: |
          unzip -l freaking-food-tracker-${{ github.run_number }}.apk > apk-inhoud.txt || true
          hits=$(grep -ci zxing apk-inhoud.txt || true)
          if [ "${hits:-0}" -gt 0 ]; then
            grep -i zxing apk-inhoud.txt | head -3 | while IFS= read -r line; do echo "::notice title=native::$line"; done
          else
            echo "::warning title=native::zxing-cpp ontbreekt in de APK"
          fi

      - name: Release maken
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Freaking Food Tracker ${{ github.run_number }}
          body: |
            Nieuwe versie van Freaking Food Tracker.
            Open dit op je Android-telefoon, tik op het .apk-bestand hieronder en installeer het.
            Commit: ${{ github.sha }}
          files: freaking-food-tracker-${{ github.run_number }}.apk
          make_latest: true
